name: Django CI / CD

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: ci
      CI_DB_NAME: testdb
      CI_DB_USER: testuser
      CI_DB_PASSWORD: testpass
      CI_DB_HOST: 127.0.0.1
      CI_DB_PORT: 5432
      SECRET_KEY: super-secret-ci-key
      DEBUG: 'True'
    

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
          python-version: 3.12
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Migrations (CREATE database)
      run: |
        python project/manage.py migrate --noinput
    - name: Run Tests
      run: |
        python project/manage.py test petadoption
  deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
        - name: chekout_code
          uses: actions/checkout@v4

        - name: setup_python
          uses: actions/setup-python@v4

        - name: deploy_application
          run: echo "the application is ready to deploy"
    
        