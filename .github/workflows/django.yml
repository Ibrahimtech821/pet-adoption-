name: Django CI / CD

on:
  push:
    branches: [ "main" , "new_frontend" ]
  pull_request:
    branches: [ "main" , "new_frontend" ]

jobs:
  test:

    runs-on: ubuntu-latest
    

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
          python-version: 3.12
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Migrations (CREATE database)
      run: |
        python project/manage.py migrate --noinput
    - name: Run Tests
      run: |
        python project/manage.py test
  deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
        - name: chekout_code
          uses: actions/checkout@v4

        - name: setup_python
          uses: actions/setup-python@v4

        - name: deploy_application
          run: echo "the application is ready to deploy"
    
        